[package]
name = "dioxus-test"
version = "0.1.0"
authors = ["Bradford Hovinen"]
edition = "2024"
description = "Test library for Dioxus based on native renderer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus-test/"
homepage = "https://dioxuslabs.com/learn/0.7/getting_started"
keywords = ["dom", "ui", "gui", "react", "testing"]

[dependencies]
accesskit = { workspace = true }
blitz-dom = { workspace = true, default-features = false }
blitz-traits = { workspace = true, default-features = false }
dioxus-vdom = { workspace = true }
dioxus-html = { workspace = true }
dioxus-native-dom = { workspace = true }
smallvec = { workspace = true }
style = { workspace = true }
test-that = { version = "0.6.0", default-features = false, features = ["regex", "num-traits"] }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }

[dev-dependencies]
dioxus = { workspace = true }
indoc = "2.0.7"
tokio = { workspace = true, features = ["rt", "macros"] }
